<!DOCTYPE html>
<html>
  <head>
    
  <script id="selfScript">

  function infohandle(e){
	e.srcElement.parentElement.children[4].style.height=""
		e.srcElement.parentElement.children[4].style.display="inline-block";
  }
  function closehandle(e){
	console.log(e)
		e.srcElement.parentElement.style.display="none";
  }
  function setButtons(){
		infos =  document.getElementsByClassName("bg-info-subtle")
		for(i=0;i<infos.length;i++){
			infos[i].addEventListener("click",infohandle)
		}
		infos =  document.getElementsByClassName("btn-close")
		for(i=0;i<infos.length;i++){
			infos[i].addEventListener("click",closehandle)
			infos[i].parentElement.style.display="none";
			
		}
  }
  document.setButtons=setButtons;
  </script>
  
  <script id="generatorScript">

  function generateButton(doc,text,url,info){
  
	if(info==null || info==""){
		return generateButtonNoInfo(doc,text,url,info)
	}
	return generateButtonInfo(doc,text,url,info)
  
  }
  function generateButtonInfo(doc,text,url,info){
  /*
  
	<div class="ButtonWithInfo">
		<a href="http://google.com">
	  <button class="btn btn-primary d-inline-flex align-items-center button-with-info" type="button">
		<span>Button 1</span> &nbsp;&nbsp;&nbsp;
	  </button></a>
		<span class="badge bg-info-subtle text-info-emphasis rounded-pill">🔍</span><br><br>
		<div class="alert alert-primary alert-dismissible fade show" role="alert">
		 This is the first button's info panel with <a href="#" class="alert-link">an example link</a>.  <br>Give it a click if you like.
		  <button type="button" class="btn-close" aria-label="Close"></button>
		</div>
	</div>
  */
	linkzone = doc.getElementById("link-zone")
	
	buttonContainer = doc.createElement("div");
	buttonContainer.className="ButtonWithInfo"
	linkzone.appendChild(buttonContainer);
	
	ahref = doc.createElement("a")
	ahref.href=url
	buttonContainer.appendChild(ahref)
	
	button=doc.createElement("button")
	button.classList.add("btn")
	button.classList.add("btn-primary")
	button.classList.add("d-inline-flex")
	button.classList.add("align-items-center")
	button.classList.add("button-with-info")
	button.type="button"
	button.innerText=text
	button.innerHTML=button.innerHTML+"&nbsp;&nbsp;&nbsp;"
	ahref.appendChild(button)
	
	span=doc.createElement("span")
	span.classList.add("badge")
	span.classList.add("bg-info-subtle")
	span.classList.add("text-info-emphasis")
	span.classList.add("rounded-pill")
	span.innerText="🔍"
	buttonContainer.appendChild(span)
	
	buttonContainer.appendChild(doc.createElement("br"));
	buttonContainer.appendChild(doc.createElement("br"));
	
	alert = doc.createElement("div");
	alert.classList.add("alert")
	alert.classList.add("alert-primary")
	alert.classList.add("alert-dismissible")
	alert.classList.add("fade")
	alert.classList.add("show")
	alert.role="alert"
	alert.innerText=info
	buttonContainer.appendChild(alert);
	
	closebtn = doc.createElement("button")
	closebtn.type="button"
	closebtn.className="btn-close"
	closebtn["aria-label"]="Close"
	alert.appendChild(closebtn);
	
  }
  
  function generateButtonNoInfo(doc,text,url,info){
	/*
	<div class="ButtonNoInfo">
	  <button class="btn btn-primary d-inline-flex align-items-center" type="button" onclick="window.location='http://google.com'">
		<span>Button 2 has no info</span> 
	  </button>
		<br>
		<br>
	</div>
	*/
	linkzone = doc.getElementById("link-zone")
	
	buttonContainer = doc.createElement("div");
	buttonContainer.className="ButtonNoInfo"
	linkzone.appendChild(buttonContainer);
	
	ahref = doc.createElement("a")
	ahref.href=url
	buttonContainer.appendChild(ahref)
	
	button=doc.createElement("button")
	button.classList.add("btn")
	button.classList.add("btn-primary")
	button.classList.add("d-inline-flex")
	button.classList.add("align-items-center")
	button.type="button"
	button.innerText=text
	ahref.appendChild(button)
	buttonContainer.appendChild(doc.createElement("br"))
	buttonContainer.appendChild(doc.createElement("br"))
  
  }
  
  function generateHeadReferences(doc){
	linkelem = doc.createElement("link")
	linkelem.href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	linkelem.rel="stylesheet" 
	linkelem.integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
	linkelem.crossOrigin="anonymous"
	doc.head.appendChild(linkelem)
	
	scriptelem = doc.createElement("script")
	scriptelem.src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	scriptelem.integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	scriptelem.crossOrigin="anonymous"
	doc.head.appendChild(scriptelem)
	
	
	if(doc!=document){
		selfscriptelem = doc.createElement("script")
		selfscriptelem.id="selfScript"
		selfscriptelem.innerHTML=document.getElementById("selfScript").innerHTML
		doc.head.appendChild(selfscriptelem);
		doc.body.outerHTML="<body onload=\"setButtons()\"></body>"
	}
  }

			--linkpage-alert-fg:`+document.getElementById("alertfg").value+`;
			
			--linkpage-btn-fg:`+document.getElementById("buttonfg").value+`;
			--linkpage-btn-bg:`+document.getElementById("buttonbg").value+`;
			--linkpage-btn-border:`+document.getElementById("buttonborder").value+`;
			
			--linkpage-btn-hover-fg:`+document.getElementById("buttonhoverfg").value+`;
			--linkpage-btn-hover-bg:`+document.getElementById("buttonhoverbg").value+`;
			--linkpage-btn-hover-border:`+document.getElementById("buttonhoverborder").value+`;
			
			--linkpage-infobtn-fg:`+document.getElementById("infobtnfg").value+`;
			--linkpage-infobtn-bg:`+document.getElementById("infobtnbg").value+`;
			
			--linkpage-infobtn-hover-fg:`+document.getElementById("infobtnhoverfg").value+`;
			--linkpage-infobtn-hover-bg:`+document.getElementById("infobtnhoverbg").value+`;
		}
	  body{
	  background-color:var(--linkpage-body-bg);
	  color:var(--linkpage-body-fg) !important;
	  text-align:center;
	  }
	  #link-zone{text-align:center;width:75%;margin-left:auto;margin-right:auto}
	  .alert{
		width:70%;
		margin-left:auto;
		margin-right:auto;
		background-color:var(--linkpage-alert-bg) !important;
		border-color:var(--linkpage-alert-border) !important;

	  .btn-primary{
		margin-left:0px;

	  }
	  .btn-primary:hover{
		margin-left:0px;

		background-color:var(--linkpage-btn-hover-bg);
		border-color:var(--linkpage-btn-hover-border);
		color:var(--linkpage-btn-hover-fg);
	  }
	  
	  .button-with-info{
		margin-right:-20px; 
		margin-left:20px; 
	  }
	  .button-with-info:hover{
		margin-right:-20px; 
		margin-left:20px; 
	  
	  }
	 
	 .rounded-pill{
		background-color:var(--linkpage-infobtn-bg) !important;
		color:var(--linkpage-infobtn-fg) !important;
		
	  }
	  .rounded-pill:hover{
		background-color:var(--linkpage-infobtn-hover-bg) !important;
		color:var(--linkpage-infobtn-hover-fg) !important;
		
		margin-right:0px; 		
		padding-top:4px;
	  }
	  
	  .accordion .badge{
		text-align:left;
	  }
	  .accordion>div{
		width:75%;
		display:inline-block;
		background-color:#101010;
		border-color:#ffffff;
		color:#FFFFFF !important;
		text-align:left;
	  }
	  .accordion-button{
		background-color:#101010 !important;
		border-color:#ffffff;
		color:#FFFFFF !important;
	  
	  }
	  .add-link-button{
	  margin:0px;
	  }
	  .add-link-button:hover{
	  margin:0px;
	  }

	doc.head.appendChild(styleelem)
  }
  function generateBodySkeleton(doc){
	container = doc.createElement("div");
	container.style.width="100%";
	container.id="linkpage-container"
	
	doc.body.appendChild(container);
	container.appendChild(doc.createElement("br"));
	header = doc.createElement("p")
	header.classList.add("display-1")
	header.id="title-text"
	container.appendChild(header);
	container.appendChild(doc.createElement("br"));
	container.appendChild(doc.createElement("br"));
	
	linkzone = doc.createElement("div");
	linkzone.id="link-zone"
	container.appendChild(linkzone);
  }
  function generateDemo(doc){
	generateHeadReferences(doc)
	generateHeadStyles(doc)
	generateBodySkeleton(doc)
	doc.getElementById("title-text").innerText="Demo"
	
	generateButtonInfo(doc,"Test Button","https://google.com","This is a link to google")
	generateButtonNoInfo(doc,"Test Button2","https://google.com","This is a link to google")
	generateButtonInfo(doc,"Test Button3","https://google.com","This is a link to google")
  
	if(doc.setButtons!=null){
		doc.setButtons();
	}
	if(doc!=document){
		srcout = document.getElementById("srcout")
		if(srcout!=null){
			document.body.removeChild(srcout)
		}
		outputText = document.createElement("textarea")
		outputText.rows=20
		outputText.style.width="100%"
		outputText.value=doc.all[0].outerHTML
		outputText.id="srcout"
		document.body.appendChild(document.createElement("hr"))
		document.body.appendChild(outputText)
	}
  }
  function clearBody(doc){
	doc.body.removeChild(doc.getElementById("linkpage-container"))
  }
  
  function generatePage(doc){
	generateHeadReferences(doc)
	generateHeadStyles(doc)
	generateBodySkeleton(doc)
	doc.getElementById("title-text").innerText=document.getElementById("title-box").value
	
	parseLinkBoxes(doc)
  
	if(doc.setButtons!=null){
		doc.setButtons();
	}
	if(doc!=document){
		srcout = document.getElementById("srcout")
		if(srcout!=null){
			document.body.removeChild(srcout)
		}
		outputText = document.createElement("textarea")
		outputText.rows=20
		outputText.style.width="100%"
		outputText.value=doc.all[0].outerHTML
		outputText.id="srcout"
		document.body.appendChild(document.createElement("hr"))
		document.body.appendChild(outputText)
	}
  }
  function addLinkBox(){
  /*
<div class="badge bg-info-subtle text-info-emphasis link-entry" >
	<label class="form-label">Text:</label>
	 <input id="Text">
	 
	 <br><br>
	 
	<label class="form-label">Info:</label><br>
	 <textarea id="Info" rows=5 style="width:100%"></textarea>
	 
	 <br><br>
	 
 <button class="btn btn-primary d-inline-flex align-items-center add-link-button" type="button">
	Delete link
  </button>
</div>
  */
  linkentry = document.createElement("div")
  linkentry.classList.add("badge")
  linkentry.classList.add("bg-info-subtle")
  linkentry.classList.add("text-info-emphasis")
  linkentry.classList.add("link-entry")
  linkentry.style.margin="5px"
  
  document.getElementById("contentPanel-buttons").appendChild(linkentry)
  
  urllabel=document.createElement("label")
  urllabel.className="form-label"
  urllabel.innerHTML="URL:&nbsp; "
  linkentry.appendChild(urllabel) 
  
  urllabel=document.createElement("input")
  urllabel.className="url-field"
  linkentry.appendChild(urllabel)
  
  linkentry.innerHTML+="&nbsp;&nbsp;"
  
  textlabel=document.createElement("label")
  textlabel.className="form-label"
  textlabel.innerHTML="Text:&nbsp;"
  linkentry.appendChild(textlabel) 
  
  textlabel=document.createElement("input")
  textlabel.className="text-field"
  linkentry.appendChild(textlabel)
  
  linkentry.appendChild(document.createElement("br"))
  linkentry.appendChild(document.createElement("br"))
  
  infolabel=document.createElement("label")
  infolabel.className="form-label"
  infolabel.innerHTML="Info:&nbsp;"
  linkentry.appendChild(infolabel) 
  linkentry.appendChild(document.createElement("br"))
  
  infolabel=document.createElement("textarea")
  infolabel.className="info-field"
  infolabel.style.width="100%"
  infolabel.rows=5
  linkentry.appendChild(infolabel)
  
  linkentry.appendChild(document.createElement("br"))
  linkentry.appendChild(document.createElement("br"))
  
  delbtn=document.createElement("button")
  delbtn.classList.add("btn");
  delbtn.classList.add("btn-primary");
  delbtn.classList.add("d-inline-flex");
  delbtn.classList.add("align-items-center");
  delbtn.classList.add("rem-link-button");
  delbtn.addEventListener("click",removeLinkBox);
  delbtn.innerText="Delete Link"
  linkentry.appendChild(delbtn)
  
  
  }
  function removeLinkBox(e){
	document.getElementById("contentPanel-buttons").removeChild(e.srcElement.parentElement)
  }
  function parseLinkBoxes(doc){
  
	buttons = document.getElementById("contentPanel-buttons").getElementsByClassName("link-entry")
	for(i=0;i<buttons.length;i++){
		url=buttons[i].getElementsByClassName("url-field")[0].value
		text=buttons[i].getElementsByClassName("text-field")[0].value
		info=buttons[i].getElementsByClassName("info-field")[0].value
		
		console.log(url + " : " +text + " : " +info)
		generateButton(doc,text,url,info)
	}
	
	
  }
  </script>
